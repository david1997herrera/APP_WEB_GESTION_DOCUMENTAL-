version: '3.8'

# IMPORTANTE:
# - Usar siempre: docker compose up -d   (NO "Run" sobre la imagen: crea huérfanos tipo hardcore_lamarr)
# - RUN_DB_INIT=false NO borra la BDD. Solo evita create_all/admin seed al arrancar.
# - Nunca usar: docker compose down -v   (eso SÍ borra el volumen postgres_data)
# - Respaldos: scripts/backup_db.py  (carpeta RESPALDOS_APP_BDD)

services:
  app:
    build: .
    container_name: APP_GESTION_DOCUMENTAL
    ports:
      - "3110:3110"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/gestion_documental
      - EMAIL_SENDER=harvest.hero.app@gmail.com
      - EMAIL_PASSWORD=bhyu xsdt vmyl pejo
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=True
      - APP_BASE_URL=http://131.196.8.22:3110
      # false = no ejecuta init_db al arrancar. NO vacía datos existentes.
      - RUN_DB_INIT=false
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: gestion_documental_db
    environment:
      - POSTGRES_DB=gestion_documental
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
